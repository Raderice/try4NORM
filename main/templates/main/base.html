<html>
<head>
<title>{% block title %}Сервис{% endblock %}</title>
<style>
body { font-family: sans-serif; background: #f8f8f8; margin: 0; }
.nav { background: #222; color: #fff; padding: 8px; }
.nav a { color: #fff; margin-right: 10px; text-decoration: none; }
.container { max-width: 600px; margin: 24px auto; background: #fff; padding: 16px; border-radius: 8px; box-shadow: 0 2px 8px #0001; }
h3 { margin-top: 0; }
.photo { display: block; width: 100%; max-width: 300px; height: 180px; object-fit: cover; margin: 8px 0; background: #ddd; border-radius: 4px; }
.btn { display: inline-block; padding: 6px 16px; background: #222; color: #fff; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; }
input, select, textarea { margin: 4px 0 12px 0; padding: 6px; width: 100%; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; }
ul { padding-left: 18px; }
.card { background: #f3f3f3; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
.status { font-size: 0.9em; padding: 2px 8px; border-radius: 3px; }
.status-new { background: #ffe082; }
.status-confirmed { background: #b9f6ca; }
.status-declined { background: #ff8a80; }
footer { text-align: center; color: #888; font-size: 0.9em; margin-top: 24px; }
</style>
</head>
<body>
<div class="nav">
{% if user.is_authenticated %}
<a href="{% url 'my_bookings' %}">Мои заявки</a>
<a href="{% url 'create_booking' %}">Новая заявка</a>
<a href="{% url 'logout' %}">Выход</a>
{% endif %}
</div>
<div class="container">
{% if messages %}{% for message in messages %}{{message}} {% endfor %}{% endif %}
{% block content %}{% endblock %}
</div>
<footer>Минималистичный сервис бронирования</footer>
</body></html>
