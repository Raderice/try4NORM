{% load static %}<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}AutoRent{% endblock %}</title>
<link rel="stylesheet" href="{% static 'main/style.css' %}">
</head><body>
<nav class="nav"><div class="nav-brand"><span>AutoRent</span></div>
<div class="nav-links">{% if user.is_authenticated %}<a href="{% url 'my_bookings' %}">Мои заявки</a><a href="{% url 'create_booking' %}">Новая заявка</a><a href="{% url 'logout' %}">Выход</a>{% else %}<a href="{% url 'login' %}">Войти</a><a href="{% url 'register' %}">Регистрация</a>{% endif %}</div></nav>
{% if messages %}<div class="container" style="margin-top:16px;margin-bottom:0">{% for m in messages %}<div class="alert {% if 'error' in m.tags %}alert-error{% else %}alert-success{% endif %}">{{m}}</div>{% endfor %}</div>{% endif %}
{% block content %}{% endblock %}
<footer>© 2025 AutoRent</footer>
<script src="{% static 'main/main.js' %}"></script>
</body></html>
