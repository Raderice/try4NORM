{% extends "main/base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card"><div class="card-body">
<h4 class="mb-3">Оформление заказа</h4>
<div class="bg-light p-3 rounded mb-3"><h5>{{product.name}}</h5><p>{{product.description}}</p><h4>{{product.price}} ₽</h4></div>
<form method="post">{% csrf_token %}
<label>Количество</label>
<input type="number" class="form-control mb-3" name="quantity" min="1" value="1" required>
<label>Адрес доставки</label>
<textarea class="form-control mb-3" name="delivery_address" rows="2" required></textarea>
<button type="submit" class="btn btn-primary w-100">Оформить</button>
<a href="{% url 'catalog' %}" class="btn btn-outline-secondary w-100 mt-2">Отмена</a>
</form>
</div></div></div></div>
{% endblock %}
