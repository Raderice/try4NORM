<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="system-ui,sans-serif" font-size="13">
  <!-- TITLE -->
  <text x="410" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a5f">ER-диаграмма: Сервис аренды автомобилей</text>

  <!-- === USER === -->
  <rect x="20" y="40" width="190" height="200" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="20" y="40" width="190" height="30" rx="8" fill="#2563eb"/>
  <rect x="20" y="56" width="190" height="14" fill="#2563eb"/>
  <text x="115" y="60" text-anchor="middle" fill="white" font-weight="bold" font-size="14">User</text>
  <line x1="20" y1="86" x2="210" y2="86" stroke="#bfdbfe" stroke-width="1"/>
  <text x="35" y="104" fill="#1e293b"><tspan font-weight="bold" fill="#7c3aed">PK</tspan>  id</text>
  <text x="35" y="122" fill="#1e293b">email</text>
  <text x="35" y="140" fill="#1e293b">full_name</text>
  <text x="35" y="158" fill="#1e293b">phone_number</text>
  <text x="35" y="176" fill="#1e293b">driver_license</text>
  <text x="35" y="194" fill="#1e293b">password</text>
  <text x="35" y="212" fill="#64748b" font-size="11">AbstractUser</text>

  <!-- === CAR === -->
  <rect x="610" y="40" width="190" height="160" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="610" y="40" width="190" height="30" rx="8" fill="#16a34a"/>
  <rect x="610" y="56" width="190" height="14" fill="#16a34a"/>
  <text x="705" y="60" text-anchor="middle" fill="white" font-weight="bold" font-size="14">Car</text>
  <line x1="610" y1="86" x2="800" y2="86" stroke="#bbf7d0" stroke-width="1"/>
  <text x="625" y="104" fill="#1e293b"><tspan font-weight="bold" fill="#7c3aed">PK</tspan>  id</text>
  <text x="625" y="122" fill="#1e293b">name</text>
  <text x="625" y="140" fill="#1e293b">price</text>
  <text x="625" y="158" fill="#1e293b">description</text>
  <text x="625" y="176" fill="#64748b" font-size="11">Model</text>

  <!-- === BOOKING === -->
  <rect x="315" y="40" width="190" height="240" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="315" y="40" width="190" height="30" rx="8" fill="#ea580c"/>
  <rect x="315" y="56" width="190" height="14" fill="#ea580c"/>
  <text x="410" y="60" text-anchor="middle" fill="white" font-weight="bold" font-size="14">Booking</text>
  <line x1="315" y1="86" x2="505" y2="86" stroke="#fed7aa" stroke-width="1"/>
  <text x="330" y="104" fill="#1e293b"><tspan font-weight="bold" fill="#7c3aed">PK</tspan>  id</text>
  <text x="330" y="122" fill="#1e293b"><tspan font-weight="bold" fill="#b45309">FK</tspan>  user_id</text>
  <text x="330" y="140" fill="#1e293b"><tspan font-weight="bold" fill="#b45309">FK</tspan>  car_id</text>
  <text x="330" y="158" fill="#1e293b">booking_date</text>
  <text x="330" y="176" fill="#1e293b">status</text>
  <text x="330" y="194" fill="#1e293b">created_at</text>
  <text x="330" y="212" fill="#64748b" font-size="11">new / confirmed / declined</text>

  <!-- RELATION: User 1---N Booking -->
  <line x1="210" y1="122" x2="315" y2="122" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="248" y="115" text-anchor="middle" fill="#2563eb" font-size="12" font-weight="bold">1</text>
  <text x="290" y="115" text-anchor="middle" fill="#2563eb" font-size="12" font-weight="bold">N</text>
  <!-- arrow -->
  <polygon points="315,118 304,122 315,126" fill="#2563eb"/>

  <!-- RELATION: Car 1---N Booking -->
  <line x1="505" y1="140" x2="610" y2="140" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="540" y="133" text-anchor="middle" fill="#16a34a" font-size="12" font-weight="bold">N</text>
  <text x="585" y="133" text-anchor="middle" fill="#16a34a" font-size="12" font-weight="bold">1</text>
  <!-- arrow -->
  <polygon points="610,136 621,140 610,144" fill="#16a34a"/>

  <!-- LEGEND -->
  <rect x="20" y="290" width="780" height="55" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="310" fill="#1e293b" font-weight="bold" font-size="12">Легенда:</text>
  <rect x="120" y="298" width="12" height="12" rx="2" fill="#7c3aed"/>
  <text x="138" y="310" fill="#475569" font-size="12">PK — первичный ключ</text>
  <rect x="310" y="298" width="12" height="12" rx="2" fill="#b45309"/>
  <text x="328" y="310" fill="#475569" font-size="12">FK — внешний ключ</text>
  <line x1="490" y1="304" x2="520" y2="304" stroke="#64748b" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="528" y="310" fill="#475569" font-size="12">Связь (отношение)</text>
  <text x="40" y="334" fill="#475569" font-size="12">Связи: User 1:N Booking (один пользователь — много заявок)  ·  Car 1:N Booking (один автомобиль — много заявок)</text>
</svg>
